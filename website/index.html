<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A secure static website delivered through AWS CloudFront and a private S3 origin.">
  <title>AWS Cloud Engineering | Secure Static Delivery</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #101827; color: #f3f6fb; }
    main { width: min(760px, 100%); padding: clamp(2rem, 6vw, 4rem); border: 1px solid #34445e; border-radius: 22px; background: #172337; box-shadow: 0 24px 80px #0005; }
    .tag { color: #8bd5ff; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 1rem 0; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1.05; }
    p { color: #bac7d9; line-height: 1.7; }
    .stack { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 2rem; }
    .stack span { padding: .55rem .8rem; border: 1px solid #405570; border-radius: 999px; color: #d8e7f7; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Cloud engineering project</div>
    <h1>Secure static content delivery on AWS.</h1>
    <p>This site is designed to be stored in a private Amazon S3 bucket and delivered globally over HTTPS through Amazon CloudFront using Origin Access Control.</p>
    <div class="stack"><span>Amazon S3</span><span>CloudFront</span><span>Terraform</span><span>GitHub Actions</span></div>
  </main>
</body>
</html>
